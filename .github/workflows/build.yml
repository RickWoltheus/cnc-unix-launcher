name: Build native launchers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check community credits and support documentation
        run: python3 scripts/community-docs.py --check
      - name: Check backend behavior
        run: |
          bash tests/backend.sh
          bash tests/ini-settings.sh
          bash tests/security.sh
          bash tests/sage.sh
      - name: Check Wine process lifecycle without games
        run: bash tests/wine-lifecycle.sh
      - name: Check profile selection and recovery
        run: bash tests/model.sh
      - name: Check Steam sign-in guidance
        run: bash tests/steam-status.sh
      - name: Check separate Steam guide without visible windows
        run: bash tests/steam-guide.sh
      - name: Build Apple Silicon app
        run: bash scripts/build.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict 'dist/C&C Unix Launcher.app'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CnC-Unix-Launcher-macOS-arm64
          path: dist/CnC-Unix-Launcher-macOS-arm64.zip
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build isolated Linux environment
        run: docker build --platform linux/amd64 -t gx-launcher-linux-test -f linux/Dockerfile.test .
      - name: Check Linux UI and shared backend
        run: |
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test python3 tests/linux-ui.py
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/wine-lifecycle.sh
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/security.sh
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/ini-settings.sh
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/sage.sh
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/backend.sh
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/steam-status.sh
      - name: Check classic engines with synthetic assets and dummy launches
        run: docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/classic-linux.sh
      - name: Check native mods with synthetic assets and online settings
        run: docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/native-linux.sh
      - name: Check Wine runtime with synthetic data and dummy launches
        run: docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/compatibility-network.sh
      - name: Build standalone Linux archive
        run: docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash linux/build.sh
      - name: Validate packaged resources and virtual desktop window
        run: |
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash dist/linux/CnCUnixLauncher/start-launcher.sh --check
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test dist/linux/CnCUnixLauncher/CnCUnixLauncher --self-check
          docker run --rm -v "$PWD:/project" gx-launcher-linux-test bash tests/linux-x11.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CnC-Unix-Launcher-linux-x86_64
          path: dist/CnC-Unix-Launcher-linux-x86_64.tar.gz
